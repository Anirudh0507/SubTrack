

spring.application.name=SubTrack
server.port=${PORT:8080}

spring.datasource.url=${SUBTRACK_DB_URL:jdbc:mysql://localhost:3306/subtrack_db}
spring.datasource.username=${SUBTRACK_DB_USERNAME:subtrack_user}
spring.datasource.password=${SUBTRACK_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

logging.level.org.springframework.security=INFO
